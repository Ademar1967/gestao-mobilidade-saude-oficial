<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Transporte Pacientes</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
      <style>
        .btn-logout {
          background-color: #ffd24d;
          color: #2a2a2a;
          border: 1px solid #e6b800;
          font-weight: 700;
          box-shadow: 0 4px 0 #c89f00;
          transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .btn-logout:hover {
          background-color: #ffcc33;
          color: #1f1f1f;
          animation: logoutPulse 0.9s ease-in-out infinite;
        }
        .btn-logout:active {
          transform: translateY(3px);
          box-shadow: 0 1px 0 #c89f00;
        }
        @keyframes logoutPulse {
          0% { box-shadow: 0 4px 0 #c89f00, 0 0 0 0 rgba(255, 210, 77, 0.45); }
          70% { box-shadow: 0 4px 0 #c89f00, 0 0 0 8px rgba(255, 210, 77, 0); }
          100% { box-shadow: 0 4px 0 #c89f00, 0 0 0 0 rgba(255, 210, 77, 0); }
        }
      </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Transporte de Pacientes</a>
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">
          <span class="text-white small">{{ user.username }}</span>
          <form method="post" action="{% url 'logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-logout px-3"><i class="bi bi-box-arrow-right me-1"></i>Sair</button>
          </form>
        </div>
        {% endif %}
      </div>
    </nav>
    <div class="container">
      {% block content %}{% endblock %}
      <!-- Scripts essenciais para autocomplete -->
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
      <script src="/static/transporte_pacientes/autocomplete.js?v=20260321-2205"></script>
      <!-- Bootstrap Bundle para Collapse e outros componentes -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      {% if user.is_authenticated %}
      <script>
        (function () {
          const TIMEOUT_MS = 3 * 60 * 1000;
          let timer;

          function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
          }

          function resetTimer() {
            clearTimeout(timer);
            timer = setTimeout(doAutoLogout, TIMEOUT_MS);
          }

          function doAutoLogout() {
            const csrfToken = getCookie('csrftoken');
            fetch('{% url "logout" %}', {
              method: 'POST',
              headers: {
                'X-CSRFToken': csrfToken,
                'Content-Type': 'application/x-www-form-urlencoded'
              },
              credentials: 'same-origin',
              body: ''
            }).finally(function () {
              window.location.href = '{% url "login" %}?next=/';
            });
          }

          ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (eventName) {
            document.addEventListener(eventName, resetTimer, { passive: true });
          });

          resetTimer();
        })();
      </script>
      {% endif %}
      {% block extra_scripts %}{% endblock %}
    </body>
    </html>
