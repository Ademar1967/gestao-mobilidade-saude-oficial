{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Transporte Pacientes</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
      <link rel="stylesheet" href="{% static 'transporte_pacientes/paleta-saude.css' %}">
      <style>
        .ui-helper-hidden-accessible {
          border: 0 !important;
          clip: rect(0 0 0 0) !important;
          height: 1px !important;
          margin: -1px !important;
          overflow: hidden !important;
          padding: 0 !important;
          position: absolute !important;
          width: 1px !important;
        }

        .ui-autocomplete {
          z-index: 3000 !important;
          max-height: 260px;
          overflow-y: auto;
          overflow-x: hidden;
        }

        .btn-logout {
          background-color: #ffd24d;
          color: #2a2a2a;
          border: 1px solid #e6b800;
          font-weight: 700;
          box-shadow: 0 4px 0 #c89f00;
          transition: transform 0.08s ease, box-shadow 0.08s ease;
        }
        .btn-logout:hover {
          background-color: #ffcc33;
          color: #1f1f1f;
          animation: logoutPulse 0.9s ease-in-out infinite;
        }
        .btn-logout:active {
          transform: translateY(3px);
          box-shadow: 0 1px 0 #c89f00;
        }
        @keyframes logoutPulse {
          0% { box-shadow: 0 4px 0 #c89f00, 0 0 0 0 rgba(255, 210, 77, 0.45); }
          70% { box-shadow: 0 4px 0 #c89f00, 0 0 0 8px rgba(255, 210, 77, 0); }
          100% { box-shadow: 0 4px 0 #c89f00, 0 0 0 0 rgba(255, 210, 77, 0); }
        }
        @media print {
          nav.navbar, .no-print, .btn-logout { display: none !important; }
          .container { max-width: 100% !important; padding: 0 !important; }
        }
      </style>
</head>
<body>
  {% include 'partials/navbar.html' %}
    <div class="container">
      {% block content %}{% endblock %}
    </div>

    <!-- Scripts essenciais para autocomplete e Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <script src="{% static 'transporte_pacientes/autocomplete.js' %}"></script>
    <!-- Bootstrap Bundle para Modal, Collapse e outros componentes -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Proteção para bootstrap global
      function garantirBootstrapGlobal() {
        if (typeof window.bootstrap === 'undefined' && typeof bootstrap !== 'undefined') {
          window.bootstrap = bootstrap;
        }
      }
      garantirBootstrapGlobal();
      // Garante que erros de modal Bootstrap não travem a busca
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('bootstrap')) {
          e.preventDefault();
        }
      });
      // Caso algum script rode antes do bundle, tenta garantir após o carregamento
      if (document.readyState === 'complete') {
        garantirBootstrapGlobal();
      } else {
        window.addEventListener('DOMContentLoaded', garantirBootstrapGlobal);
      }
    </script>
    {% if user.is_authenticated %}
    <script>
      (function () {
        const TIMEOUT_MS = 3 * 60 * 1000;
        let timer;
        function getCookie(name) {
          const value = `; ${document.cookie}`;
          const parts = value.split(`; ${name}=`);
          if (parts.length === 2) return parts.pop().split(';').shift();
        }
        function resetTimer() {
          clearTimeout(timer);
          timer = setTimeout(doAutoLogout, TIMEOUT_MS);
        }
        function doAutoLogout() {
          const csrfToken = getCookie('csrftoken');
          fetch('{% url "logout" %}', {
            method: 'POST',
            headers: {
              'X-CSRFToken': csrfToken,
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            credentials: 'same-origin',
            body: ''
          }).finally(function () {
            window.location.href = '{% url "login" %}?next=/';
          });
        }
        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(function (eventName) {
          document.addEventListener(eventName, resetTimer, { passive: true });
        });
        resetTimer();
      })();
    </script>
    {% endif %}
    <!-- Modal para exibir dados completos do paciente -->
    <div class="modal fade" id="modalPacienteNavbar" tabindex="-1" aria-labelledby="modalPacienteNavbarLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="modalPacienteNavbarLabel"><i class="bi bi-person-vcard me-2"></i>Dados do Paciente</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body" id="modalPacienteNavbarBody">
            <div class="text-center text-muted py-3">Carregando...</div>
          </div>
        </div>
      </div>
    </div>
    <script>
    // Busca global de pacientes na navbar
    document.addEventListener('DOMContentLoaded', function() {
      var input = document.getElementById('input-busca-paciente-navbar');
      var dropdown = document.getElementById('autocomplete-paciente-navbar');
      var btn = document.getElementById('btn-busca-paciente-navbar');
      var modal = new bootstrap.Modal(document.getElementById('modalPacienteNavbar'));
      var modalBody = document.getElementById('modalPacienteNavbarBody');
      if (!input || !dropdown) return;
      function showDropdown(items) {
        dropdown.innerHTML = '';
        if (!items.length) {
          dropdown.innerHTML = '<div class="dropdown-item text-muted">Nenhum paciente encontrado</div>';
          dropdown.classList.add('show');
          return;
        }
        items.forEach(function(item) {
          var html = '<div class="dropdown-item" style="cursor:pointer;" data-id="'+item.id+'">';
          html += '<b>'+item.nome+'</b> <span class="badge bg-secondary ms-1">ID: '+(item.debug_id||item.id)+'</span> | <span class="text-muted">'+(item.cartao_sis||'')+'</span> | '+(item.telefone||'')+' | '+(item.idade||'')+' anos';
          html += '</div>';
          dropdown.innerHTML += html;
        });
        dropdown.classList.add('show');
        dropdown.querySelectorAll('.dropdown-item').forEach(function(el) {
          el.addEventListener('click', function() {
            var id = el.getAttribute('data-id');
            // Só permite abrir detalhes se o id for numérico
            if (id && /^\d+$/.test(id)) {
              fetchPacienteCompleto(id);
            } else {
              modalBody.innerHTML = '<div class="alert alert-info">Para ver detalhes completos, cadastre o paciente no sistema.</div>';
              modal.show();
            }
            dropdown.classList.remove('show');
          });
        });
      }
      function buscarPacientes(term) {
        if (!term || term.length < 2) { dropdown.classList.remove('show'); return; }
        fetch('/api/pacientes/sugestoes/?q='+encodeURIComponent(term))
          .then(r=>r.json())
          .then(data=>{
            var lista = (data && data.resultados) ? data.resultados : [];
            showDropdown(lista);
          });
      }
      function fetchPacienteCompleto(id) {
        modalBody.innerHTML = '<div class="text-center text-muted py-3">Carregando...</div>';
        modal.show();
        fetch('/api/pacientes/'+id+'/detalhes/', { credentials: 'same-origin' })
          .then(async r => {
            let data;
            try { data = await r.json(); } catch (e) { data = {}; }
            // LOG extra para depuração
            console.log('[DEBUG] Status fetch paciente:', r.status);
            console.log('[DEBUG] JSON retornado:', data);
            if (r.status === 403 && data.erro === 'nao_autenticado') {
              throw { type: 'auth', data, status: r.status };
            }
            if (r.status === 404 || data.erro === 'Paciente não encontrado.') {
              throw { type: 'notfound', data, status: r.status };
            }
            if (!r.ok) {
              throw { type: 'other', data, status: r.status };
            }
            return data;
          })
          .then(data => {
            if (!data || !data.id) {
              modalBody.innerHTML = '<div class="alert alert-warning">Paciente não encontrado.<br><pre style="font-size:12px;">'+JSON.stringify(data, null, 2)+'</pre></div>';
              return;
            }
            var html = '<div class="row g-2">';
            html += '<div class="col-md-6"><b>Nome:</b> '+data.nome+'</div>';
            html += '<div class="col-md-3"><b>Idade:</b> '+(data.idade||'')+'</div>';
            html += '<div class="col-md-3"><b>Peso:</b> '+(data.peso||'')+' kg</div>';
            html += '<div class="col-md-6"><b>Cartão SUS/SIS:</b> '+(data.cartao_sis||'')+'</div>';
            html += '<div class="col-md-6"><b>Telefone:</b> '+(data.ddd||'')+' '+(data.telefone||'')+'</div>';
            html += '<div class="col-md-12"><b>Endereço:</b> '+[data.rua, data.numero, data.bairro, data.cidade, data.estado, data.cep].filter(Boolean).join(', ')+'</div>';
            html += '<div class="col-md-12"><b>Referência:</b> '+(data.referencia||'')+'</div>';
            html += '<div class="col-md-12"><b>Observações:</b> '+(data.observacoes||'')+'</div>';
            html += '<div class="col-md-12"><b>Status:</b> '+(data.status||'')+'</div>';
            html += '</div>';
            if (data.atualizacoes && data.atualizacoes.length) {
              html += '<hr><b>Atualizações recentes:</b><ul>';
              data.atualizacoes.forEach(function(a) {
                html += '<li>'+a+'</li>';
              });
              html += '</ul>';
            }
            modalBody.innerHTML = html;
          })
          .catch(err => {
            let msg = 'Erro ao buscar dados do paciente.';
            let tipo = 'danger';
            let extra = '';
            if (err && typeof err === 'object') {
              if (err.type === 'auth') { msg = 'Sua sessão expirou. Faça login novamente.'; tipo = 'warning'; }
              else if (err.type === 'notfound') { msg = 'Paciente não encontrado.'; tipo = 'warning'; }
              if (err.data) {
                if (err.data.erro) {
                  msg += '<br><b>Detalhe:</b> ' + err.data.erro;
                }
                extra = '<br><pre style="font-size:12px;">'+JSON.stringify(err.data, null, 2)+'</pre>';
              }
            }
            modalBody.innerHTML = '<div class="alert alert-'+tipo+'">'+msg+extra+'</div>';
          });
      }
      input.addEventListener('input', function() {
        buscarPacientes(input.value.trim());
      });
      btn.addEventListener('click', function() {
        buscarPacientes(input.value.trim());
      });
      input.addEventListener('focus', function() {
        if (input.value.trim().length >= 2) buscarPacientes(input.value.trim());
      });
      document.addEventListener('click', function(e) {
        if (!dropdown.contains(e.target) && e.target !== input) dropdown.classList.remove('show');
      });
    });
    </script>
    {% block scripts %}{% endblock %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
          const draftPrefix = 'autosave-draft:';
          const pendingPrefix = 'autosave-pending:';

          function debounce(fn, wait) {
            let timeoutId;
            return function () {
              clearTimeout(timeoutId);
              timeoutId = setTimeout(fn, wait);
            };
          }

          function getDraftKey(form) {
            return draftPrefix + (form.dataset.autosaveKey || form.id || form.action || window.location.pathname);
          }

          function getPendingKey(form) {
            return pendingPrefix + (form.dataset.autosaveKey || form.id || form.action || window.location.pathname);
          }

          function collectFormData(form) {
            const payload = {};
            form.querySelectorAll('input, select, textarea').forEach(function (field) {
              if (!field.name || field.disabled) return;
              if (['password', 'file', 'submit', 'button', 'hidden'].includes(field.type)) return;

              if (field.type === 'checkbox') {
                payload[field.name] = field.checked;
                return;
              }

              if (field.type === 'radio') {
                if (field.checked) {
                  payload[field.name] = field.value;
                }
                return;
              }

              payload[field.name] = field.value;
            });
            return payload;
          }

          function hasMeaningfulDraft(payload) {
            return Object.values(payload).some(function (value) {
              if (typeof value === 'boolean') return value;
              return String(value || '').trim() !== '';
            });
          }

          function applyFormData(form, payload) {
            Object.keys(payload).forEach(function (name) {
              const escapedName = window.CSS && CSS.escape ? CSS.escape(name) : name.replace(/"/g, '\\"');
              const fields = form.querySelectorAll('[name="' + escapedName + '"]');
              if (!fields.length) return;

              fields.forEach(function (field) {
                if (field.type === 'checkbox') {
                  field.checked = Boolean(payload[name]);
                } else if (field.type === 'radio') {
                  field.checked = field.value === payload[name];
                } else {
                  field.value = payload[name] ?? '';
                }
                field.dispatchEvent(new Event('change', { bubbles: true }));
                field.dispatchEvent(new Event('input', { bubbles: true }));
              });
            });
          }

          document.querySelectorAll('form[data-autosave="true"]').forEach(function (form) {
            const draftKey = getDraftKey(form);
            const pendingKey = getPendingKey(form);
            const label = form.dataset.autosaveLabel || 'deste formulário';
            const saveDraft = debounce(function () {
              const payload = collectFormData(form);
              if (hasMeaningfulDraft(payload)) {
                localStorage.setItem(draftKey, JSON.stringify(payload));
              } else {
                localStorage.removeItem(draftKey);
              }
            }, 250);

            const hasValidationErrors = Boolean(form.querySelector('.alert-danger, .text-danger, .is-invalid'));
            if (sessionStorage.getItem(pendingKey) === '1' && !hasValidationErrors) {
              localStorage.removeItem(draftKey);
              sessionStorage.removeItem(pendingKey);
            }

            const existingDraft = localStorage.getItem(draftKey);
            if (existingDraft) {
              try {
                const payload = JSON.parse(existingDraft);
                if (hasMeaningfulDraft(payload)) {
                  const shouldRestore = window.confirm('Encontramos um rascunho salvo ' + label + '. Deseja restaurar os dados?');
                  if (shouldRestore) {
                    applyFormData(form, payload);
                  }
                }
              } catch (error) {
                localStorage.removeItem(draftKey);
              }
            }

            form.addEventListener('input', saveDraft);
            form.addEventListener('change', saveDraft);
            form.addEventListener('submit', function () {
              sessionStorage.setItem(pendingKey, '1');
            });
            form.addEventListener('reset', function () {
              localStorage.removeItem(draftKey);
              sessionStorage.removeItem(pendingKey);
            });
          });
        });
      </script>
      {% block extra_scripts %}{% endblock %}
    <footer style="text-align:center; margin-top:2em; color:#888; font-size:0.95em;">
      <a href="/politica-privacidade/" style="color:#007bff; text-decoration:underline;">Política de Privacidade</a>
