{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="alert alert-warning py-2 mb-3" style="border-left:4px solid #f59f00;">
  <strong>Aviso de edição:</strong> você está no template <strong>editar_condutor.html</strong>.
</div>
<div class="container mt-4">
  <h2 class="mb-4">Editar Condutor</h2>
  <form method="post" id="form-editar-condutor" data-autosave="true" data-autosave-label="da edição de condutor">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{% url 'transporte_pacientes:cadastrar_condutor' %}" class="btn btn-secondary ms-2">Cancelar</a>
  </form>
</div>
{% endblock %}
