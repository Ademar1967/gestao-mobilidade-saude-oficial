{% extends 'base.html' %}
{% block content %}
<div class="alert alert-warning py-2 mb-3" style="border-left:4px solid #f59f00;">
  <strong>Aviso de edição:</strong> você está no template <strong>estatistica_clinica.html</strong>.
</div>
<div class="container mt-4">
  <h2 class="mb-4"><i class="bi bi-hospital"></i> Estatística de Transportes por Clínica</h2>
  <table class="tabela-hospitais">
    <thead>
      <tr>
        <th>Clínica</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      {% for row in dados %}
      <tr>
        <td title="{{ row.clinica }}">{{ row.clinica }}</td>
        <td>{{ row.total }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <style>
  .tabela-hospitais {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    background: #fff;
  }
  .tabela-hospitais th, .tabela-hospitais td {
    padding: 12px 16px;
    text-align: left;
    vertical-align: middle;
    font-size: 1rem;
    white-space: nowrap;
  }
  .tabela-hospitais th {
    background: #f5f7fa;
    color: #333;
    font-weight: 600;
    border-bottom: 2px solid #e3e6ea;
  }
  .tabela-hospitais td {
    max-width: 320px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    position: relative;
  }
  .tabela-hospitais tr:hover {
    background: #f0f4fa;
    transition: background 0.2s;
  }
  @media (max-width: 600px) {
    .tabela-hospitais {
      font-size: 0.92em;
      display: block;
      overflow-x: auto;
    }
  }
  </style>
  <canvas id="graficoClinica" height="120"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var ctx = document.getElementById('graficoClinica').getContext('2d');
    var labels = [{% for row in dados %}'{{ row.clinica|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %}];
    var data = [{% for row in dados %}{{ row.total }}{% if not forloop.last %}, {% endif %}{% endfor %}];
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Total de Transportes',
          data: data,
          backgroundColor: 'rgba(54, 162, 235, 0.6)',
          borderColor: 'rgba(54, 162, 235, 1)',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          title: { display: true, text: 'Transportes por Clínica' }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  });
</script>
{% endblock %}
