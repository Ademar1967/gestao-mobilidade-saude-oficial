{% extends 'base.html' %}
{% block content %}
<div class="alert alert-warning py-2 mb-3" style="border-left:4px solid #f59f00;">
  <strong>Aviso de edição:</strong> você está no template <strong>estatistica_veiculo.html</strong>.
</div>
<div class="container mt-4">
  <h2 class="mb-4"><i class="bi bi-truck"></i> Estatística de Transportes por Veículo</h2>
  <table class="table table-bordered table-striped mb-4">
    <thead class="table-warning">
      <tr>
        <th>Veículo</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      {% for row in dados %}
      <tr>
        <td>{{ row.veiculo }}</td>
        <td>{{ row.total }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <canvas id="graficoVeiculo" height="120"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    var ctx = document.getElementById('graficoVeiculo').getContext('2d');
    var labels = [{% for row in dados %}'{{ row.veiculo|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %}];
    var data = [{% for row in dados %}{{ row.total }}{% if not forloop.last %}, {% endif %}{% endfor %}];
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'Total de Transportes',
          data: data,
          backgroundColor: 'rgba(255, 193, 7, 0.6)',
          borderColor: 'rgba(255, 193, 7, 1)',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false }
        }
      }
    });
  });
</script>
{% endblock %}
