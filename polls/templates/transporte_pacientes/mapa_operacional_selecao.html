{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width:700px;">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex align-items-center gap-2">
      <span style="font-size:1.5rem;">📋</span>
      <span class="fw-bold fs-5">Gerar Mapa de Viagem</span>
    </div>
    <div class="card-body">
      <form method="get" action="{% url 'transporte_pacientes:mapa_operacional_imprimir' %}" id="formMapa">

        <!-- Empresa prestadora -->
        <div class="mb-3">
          <label class="form-label fw-bold">Empresa Prestadora</label>
          <input type="text" class="form-control" name="empresa" value="NEM"
                 placeholder="Ex: NEM, CASEM…"
                 title="Nome da empresa que aparece na escala. Pode ser alterado livremente."
                 maxlength="30">
          <div class="form-text">Padrão: NEM. Pode ser qualquer nome.</div>
        </div>

        <!-- Data -->
        <div class="mb-3">
          <label class="form-label fw-bold">Data da Viagem</label>
          <input type="date" class="form-control" name="data" value="{{ hoje }}" required>
        </div>

        <!-- Número da viagem -->
        <div class="mb-3">
          <label class="form-label fw-bold">Número da Viagem</label>
          <select class="form-select" name="numero_viagem" required>
            {% for nv in numeros_viagem %}
            <option value="{{ nv }}">{{ nv }}</option>
            {% endfor %}
          </select>
          <div class="form-text">Selecione quantas viagens serão impressas nesta escala.</div>
        </div>

        <!-- Condutor / Motorista -->
        <div class="mb-3">
          <label class="form-label fw-bold">Motorista</label>
          <select class="form-select" name="condutor">
            <option value="">— Todos os motoristas —</option>
            {% for c in condutores %}
            <option value="{{ c.id }}">{{ c.nome }}</option>
            {% endfor %}
          </select>
        </div>

        <!-- Veículo -->
        <div class="mb-3">
          <label class="form-label fw-bold">Veículo / Ambulância</label>
          <select class="form-select" name="veiculo">
            <option value="">— Todos os veículos —</option>
            {% for v in veiculos %}
            <option value="{{ v.id }}">
              {% if v.tipo_veiculo == 'ambulancia' %}AMB {{ v.patrimonio }}{% else %}VAN {{ v.placa }}{% endif %}
            </option>
            {% endfor %}
          </select>
        </div>

        <!-- Hora base de saída -->
        <div class="mb-4">
          <label class="form-label fw-bold">Hora Base de Saída <span class="text-muted fw-normal">(opcional)</span></label>
          <input type="time" class="form-control" name="hora_saida" style="max-width:140px;">
          <div class="form-text">Aparece no cabeçalho do mapa. Ex: 06:00</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary fw-bold px-4">
            <i class="bi bi-printer"></i> Gerar Mapa
          </button>
          <a href="{% url 'transporte_pacientes:listar_transportes' %}" class="btn btn-outline-secondary">
            Voltar
          </a>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
