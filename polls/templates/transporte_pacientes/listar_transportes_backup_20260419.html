{% extends 'base.html' %}

{% block content %}
<style>
/* Centralização absoluta do título */
.card-header {
  display: flex !important;
  justify-content: center !important;
  align-items: center !important;
}
.titulo-impressao {
  display: inline-block !important;
  text-align: center !important;
  font-size: 26px !important;
  color: #1976d2 !important;
  font-weight: bold !important;
  margin-top: 18px !important;
  margin-bottom: 18px !important;
  letter-spacing: 1px;
  width: auto !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}
/* Botão de impressão na tela */
.btn-print {
  background: #1976d2 !important;
  color: #fff !important;
  border: none !important;
  border-radius: 6px !important;
  padding: 12px 28px !important;
  font-size: 18px !important;
  font-weight: bold !important;
  box-shadow: 0 2px 8px rgba(25, 118, 210, 0.18) !important;
  cursor: pointer !important;
  transition: box-shadow 0.1s, transform 0.1s !important;
  margin-bottom: 20px !important;
  margin-right: 14px !important;
  outline: none !important;
  display: inline-block !important;
  min-width: 180px !important;
  min-height: 48px !important;
}
.btn-novo {
  background: #388e3c !important;
  color: #fff !important;
  border: none !important;
  border-radius: 6px !important;
  padding: 12px 28px !important;
  font-size: 18px !important;
  font-weight: bold !important;
  box-shadow: 0 2px 8px rgba(56, 142, 60, 0.13) !important;
  cursor: pointer !important;
  transition: box-shadow 0.1s, transform 0.1s !important;
  margin-bottom: 20px !important;
  margin-right: 0 !important;
  outline: none !important;
  display: inline-block !important;
  min-width: 180px !important;
  min-height: 48px !important;
}
.btn-novo:active {
  box-shadow: 0 1px 2px rgba(56, 142, 60, 0.18) !important;
  transform: translateY(2px) scale(0.98) !important;
.btn-print:active {
  box-shadow: 0 1px 2px rgba(25, 118, 210, 0.22) !important;
  transform: translateY(2px) scale(0.98) !important;
}
@media print {
  .btn-print, .btn-novo, .no-print, .no-print *, button[aria-hidden="true"], a.btn-novo, button.btn-print {
    display: none !important;
    visibility: hidden !important;
    width: 0 !important;
    height: 0 !important;
    position: absolute !important;
    left: -9999px !important;
    top: -9999px !important;
    overflow: hidden !important;
    opacity: 0 !important;
  }
  body, html {
    background: #fff !important;
    color: #222 !important;
    font-family: Arial, Helvetica, sans-serif !important;
    font-size: 15px !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  table, th, td, tr, tbody, thead {
    font-size: 15px !important;
  }
  .container, .row, .col-lg-10, .col-md-12, .col-12, .card, .card-body, .table-responsive {
    width: 100vw !important;
    max-width: 100vw !important;
    margin: 0 !important;
    padding: 0 !important;
    background: #fff !important;
    color: #222 !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
}
</style>
{% endblock %}
