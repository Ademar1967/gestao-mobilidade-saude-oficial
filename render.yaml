services:
  - type: web
    name: transporte-de-enfermos
    runtime: python
    repo: https://github.com/Ademar1967/-transporte-de-enfermos
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /login/
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: transporte-de-enfermos.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://transporte-de-enfermos.onrender.com
      - key: SESSION_COOKIE_AGE
        value: "28800"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: transporte-de-enfermos-db
          property: connectionString

  - type: pserv
    name: transporte-de-enfermos-db
    ipAllowList: []
    disk:
      name: transporte-de-enfermos-db-data
      sizeGB: 1
