{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center min-vh-100" style="background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);">
  <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%; border-radius: 1.5rem;">
    <div class="text-center mb-4">
      <img src="{% static 'logo.png' %}" alt="Logo" style="max-width: 80px;">
      <h2 class="mt-2 mb-0" style="font-weight: 700; color: #2d3748;">Bem-vindo</h2>
      <p class="text-muted" style="font-size: 1rem;">Acesso restrito - Faça login para continuar</p>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger" role="alert">
        Usuário ou senha inválidos. Tente novamente.
      </div>
    {% endif %}
    <form method="post" autocomplete="off">
      {% csrf_token %}
      <div class="mb-3">
        <label for="id_username" class="form-label">Usuário</label>
        <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="Digite seu usuário">
      </div>
      <div class="mb-3">
        <label for="id_password" class="form-label">Senha</label>
        <input type="password" name="password" required class="form-control" id="id_password" placeholder="Digite sua senha">
      </div>
      <button type="submit" class="btn btn-primary w-100" style="font-weight: 600;">Entrar</button>
    </form>
    <div class="mt-3 text-center">
      <small class="text-muted">© {{ year|default:2026 }} Transporte de Pacientes SP</small>
    </div>
  </div>
</div>
{% endblock %}
